x-app: &app
  env_file:
    - ${ENV_FILE:-.env.production}
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
  networks:
    - citeaura

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - citeaura

  api:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - citeaura_work:/app/work
    ports:
      - "127.0.0.1:${APP_PORT:-18000}:8000"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    volumes:
      - citeaura_work:/app/work

  beat:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    command: ["celery", "-A", "api.worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/citeaura-celerybeat-schedule"]

  nginx:
    profiles: ["standalone-nginx"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    networks:
      - citeaura

volumes:
  redis_data:
  citeaura_work:

networks:
  citeaura:
    driver: bridge
