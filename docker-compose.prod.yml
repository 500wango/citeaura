x-logging: &default-logging
  driver: json-file
  options:
    # 无上限的 json-file 日志会在崩溃循环或 INFO 输出下写满宿主磁盘，
    # 进而让同机 PostgreSQL 无法写 WAL。
    max-size: "10m"
    max-file: "3"

x-app: &app
  env_file:
    - ${ENV_FILE:-.env.production}
  environment:
    CITEAURA_SOURCE_REVISION: ${CITEAURA_SOURCE_REVISION:-unknown}
  logging: *default-logging
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
  networks:
    - citeaura

services:
  postgres:
    profiles: ["local-postgres"]
    image: postgres:${POSTGRES_MAJOR:-18}-alpine
    logging: *default-logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-citeaura}
      POSTGRES_USER: ${POSTGRES_USER:-citeaura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - citeaura

  redis:
    image: redis:7-alpine
    logging: *default-logging
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "printf 'appendonly yes\\nrequirepass %s\\n' \"$$REDIS_PASSWORD\" > /tmp/redis.conf && exec redis-server /tmp/redis.conf"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - citeaura

  api:
    <<: *app
    environment:
      CITEAURA_SOURCE_REVISION: ${CITEAURA_SOURCE_REVISION:-unknown}
      # 启动时自动迁移（wait-for-db → 备份 → upgrade → 校验）。
      # 多副本部署必须设为 0 并改用一次性 job，否则会并发迁移。
      AUTO_MIGRATE: ${AUTO_MIGRATE:-1}
      # 迁移备份写进持久卷，否则容器重建后备份一起消失。
      CITEAURA_BACKUP_DIR: /app/work/backups
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      args:
        GIT_SHA: ${CITEAURA_SOURCE_REVISION:-unknown}
    command:
      - sh
      - -c
      - >-
        exec uvicorn api.main:app --host 0.0.0.0 --port 8000 --proxy-headers
        --forwarded-allow-ips="${FORWARDED_ALLOW_IPS:-127.0.0.1,172.16.0.0/12}"
    volumes:
      - citeaura_work:/app/work
    ports:
      - "127.0.0.1:${APP_PORT:-18000}:8000"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
      args:
        GIT_SHA: ${CITEAURA_SOURCE_REVISION:-unknown}
    volumes:
      - citeaura_work:/app/work
    healthcheck:
      test: ["CMD-SHELL", "celery -A api.worker.celery_app inspect ping --timeout=5 | grep -q 'pong'"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 默认 10 秒后 SIGKILL；acks_late 会把未确认任务重投，给 Celery 留出
    # 优雅关闭当前任务的时间。
    stop_grace_period: 5m

  beat:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
      args:
        GIT_SHA: ${CITEAURA_SOURCE_REVISION:-unknown}
    command: ["celery", "-A", "api.worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/app/work/celerybeat-schedule"]
    volumes:
      - citeaura_work:/app/work
    healthcheck:
      # /proc/1/cmdline 用 NUL 分隔 argv，参数之间没有空格，所以必须按 NUL 切分后再判断成员。
      # 这里刻意不写反斜杠转义：YAML 双引号标量会把 \0 解析成真正的 NUL 字节，反而弄坏源码。
      # 进程存在不等于调度线程活着：同时要求 schedule 文件在 15 分钟内更新过。
      test: ["CMD", "python", "-c", "import pathlib,sys,time; p=pathlib.Path('/app/work/celerybeat-schedule'); alive=b'beat' in pathlib.Path('/proc/1/cmdline').read_bytes().split(bytes([0])); fresh=(not p.exists()) or time.time()-p.stat().st_mtime < 900; sys.exit(0 if alive and fresh else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    stop_grace_period: 2m

  nginx:
    profiles: ["standalone-nginx"]
    image: nginx:1.27-alpine
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/templates/citeaura.conf.template:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    command: ["/bin/sh", "-c", "sed \"s/__DOMAIN__/$${DOMAIN}/g\" /etc/nginx/templates/citeaura.conf.template > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"]
    networks:
      - citeaura

volumes:
  # 显式命名，避免 Compose 项目名变化（-p、改名目录）时创建一套空库。
  postgres_data:
    name: ${CITEAURA_POSTGRES_VOLUME:-citeaura_postgres_data}
  redis_data:
    name: ${CITEAURA_REDIS_VOLUME:-citeaura_redis_data}
  citeaura_work:
    name: ${CITEAURA_WORK_VOLUME:-citeaura_citeaura_work}
    external: ${CITEAURA_WORK_EXTERNAL:-false}

networks:
  citeaura:
    driver: bridge
