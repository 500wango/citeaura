x-app: &app
  env_file:
    - ${ENV_FILE:-.env.production}
  environment:
    CITEAURA_SOURCE_REVISION: ${CITEAURA_SOURCE_REVISION:-unknown}
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - citeaura

services:
  postgres:
    profiles: ["local-postgres"]
    image: postgres:${POSTGRES_MAJOR:-18}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-citeaura}
      POSTGRES_USER: ${POSTGRES_USER:-citeaura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - citeaura

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "printf 'appendonly yes\\nrequirepass %s\\n' \"$$REDIS_PASSWORD\" > /tmp/redis.conf && exec redis-server /tmp/redis.conf"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - citeaura

  api:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    command:
      - sh
      - -c
      - >-
        exec uvicorn api.main:app --host 0.0.0.0 --port 8000 --proxy-headers
        --forwarded-allow-ips="${FORWARDED_ALLOW_IPS:-127.0.0.1}"
    volumes:
      - citeaura_work:/app/work
    ports:
      - "127.0.0.1:${APP_PORT:-18000}:8000"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    volumes:
      - citeaura_work:/app/work
    healthcheck:
      test: ["CMD-SHELL", "celery -A api.worker.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3

  beat:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    command: ["celery", "-A", "api.worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/app/work/celerybeat-schedule"]
    volumes:
      - citeaura_work:/app/work

  nginx:
    profiles: ["standalone-nginx"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    networks:
      - citeaura

volumes:
  postgres_data:
  redis_data:
  citeaura_work:

networks:
  citeaura:
    driver: bridge
