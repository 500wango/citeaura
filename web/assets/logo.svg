<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="100%" height="100%">
  <defs>
    <linearGradient id="ca-logo-grad1-sub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="ca-logo-grad2-sub" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <style>
      .ca-brand-text {
        font-family: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 44px;
        font-weight: 700;
        letter-spacing: -1.5px;
        fill: #0f172a;
      }
      @media (prefers-color-scheme: dark) {
        .ca-brand-text { fill: #f8fafc; }
      }
      [data-theme="dark"] .ca-brand-text { fill: #f8fafc; }
      [data-theme="light"] .ca-brand-text { fill: #0f172a; }
    </style>
  </defs>

  <!-- Ribbon Monogram Symbol -->
  <g transform="translate(4, 5) scale(0.4)">
    <path d="M 150 55 C 100 20 38 50 38 100 C 38 150 100 180 150 145 C 120 165 62 145 62 100 C 62 55 120 35 150 55 Z"
          fill="url(#ca-logo-grad1-sub)"/>
    <path d="M 75 145 L 123 48 C 125 43 131 43 133 48 L 170 145"
          fill="none" stroke="url(#ca-logo-grad1-sub)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 88 112 H 152" stroke="url(#ca-logo-grad2-sub)" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Brand Wordmark -->
  <text x="96" y="58" class="ca-brand-text">CiteAura</text>
</svg>
