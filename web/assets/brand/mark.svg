<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="ca-primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="ca-accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Continuous Infinity Silk Ribbon CA Monogram -->
  <g>
    <!-- Outer Curved C Ribbon -->
    <path d="M 150 55 C 100 20 38 50 38 100 C 38 150 100 180 150 145 C 120 165 62 145 62 100 C 62 55 120 35 150 55 Z"
          fill="url(#ca-primary-grad)"/>
    <!-- Intersecting Smooth A Path -->
    <path d="M 75 145 L 123 48 C 125 43 131 43 133 48 L 170 145"
          fill="none" stroke="url(#ca-primary-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Ribbon Crossbar Overlay -->
    <path d="M 88 112 H 152" stroke="url(#ca-accent-grad)" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
