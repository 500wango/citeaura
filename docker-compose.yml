x-app: &app
  image: python:3.12-slim
  working_dir: /app
  volumes:
    - .:/app
  environment:
    DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://citeaura:citeaura@postgres:5432/citeaura}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
    RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-120}
    RATE_LIMIT_AUTH_REQUESTS: ${RATE_LIMIT_AUTH_REQUESTS:-20}
    RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    RATE_LIMIT_TRUST_PROXY_HEADERS: ${RATE_LIMIT_TRUST_PROXY_HEADERS:-false}
    JWT_SECRET: ${JWT_SECRET:-}
    AES_KEY: ${AES_KEY:-}
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    BILLING_ENABLED: ${BILLING_ENABLED:-false}
    BILLING_ANNUAL_DISCOUNT_PERCENT: ${BILLING_ANNUAL_DISCOUNT_PERCENT:-16.67}
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    STRIPE_CURRENCY: ${STRIPE_CURRENCY:-cny}
    PASSWORD_RESET_EMAIL_ENABLED: ${PASSWORD_RESET_EMAIL_ENABLED:-false}
    PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
    AUTH_SMTP_HOST: ${AUTH_SMTP_HOST:-}
    AUTH_SMTP_PORT: ${AUTH_SMTP_PORT:-587}
    AUTH_SMTP_SECURITY: ${AUTH_SMTP_SECURITY:-starttls}
    AUTH_SMTP_USERNAME: ${AUTH_SMTP_USERNAME:-}
    AUTH_SMTP_PASSWORD: ${AUTH_SMTP_PASSWORD:-}
    AUTH_SMTP_FROM_EMAIL: ${AUTH_SMTP_FROM_EMAIL:-}
    AUTH_SMTP_FROM_NAME: ${AUTH_SMTP_FROM_NAME:-CiteAura}
    GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
    GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
    OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
    OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:-}
    OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
    OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-}
    OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
    OBJECT_STORAGE_PREFIX: ${OBJECT_STORAGE_PREFIX:-citeaura-archives}
    OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-false}
    OBJECT_STORAGE_SSE: ${OBJECT_STORAGE_SSE:-}
    OBJECT_STORAGE_RETENTION_COUNT: ${OBJECT_STORAGE_RETENTION_COUNT:-12}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-citeaura}
      POSTGRES_USER: ${POSTGRES_USER:-citeaura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-citeaura}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    <<: *app
    command: >-
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      uvicorn api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: >-
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      celery -A api.worker.celery_app worker --loglevel=INFO"

  beat:
    <<: *app
    command: >-
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      celery -A api.worker.celery_app beat --loglevel=INFO
      --schedule=/tmp/citeaura-celerybeat-schedule"

volumes:
  postgres_data:
