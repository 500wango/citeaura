name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: citeaura-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://citeaura.com

    steps:
      - name: Update and deploy CiteAura
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          : "${VPS_HOST:?VPS_HOST is required}"
          : "${VPS_USER:?VPS_USER is required}"
          : "${VPS_SSH_PRIVATE_KEY:?VPS_SSH_PRIVATE_KEY is required}"
          : "${VPS_KNOWN_HOSTS:?VPS_KNOWN_HOSTS is required}"
          VPS_PORT="${VPS_PORT:-22}"
          if ! [[ "$VPS_PORT" =~ ^[0-9]+$ ]] || ((VPS_PORT < 1 || VPS_PORT > 65535)); then
            printf 'VPS_PORT must be an integer between 1 and 65535.\n' >&2
            exit 1
          fi

          SSH_KEY_FILE="$RUNNER_TEMP/citeaura_deploy_key"
          KNOWN_HOSTS_FILE="$RUNNER_TEMP/citeaura_known_hosts"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' >"$SSH_KEY_FILE"
          printf '%s\n' "$VPS_KNOWN_HOSTS" >"$KNOWN_HOSTS_FILE"
          chmod 600 "$SSH_KEY_FILE" "$KNOWN_HOSTS_FILE"

          ssh \
            -p "$VPS_PORT" \
            -i "$SSH_KEY_FILE" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$KNOWN_HOSTS_FILE" \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -- "$VPS_USER@$VPS_HOST" \
            bash -s -- "$GITHUB_SHA" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          EXPECTED_SHA="$1"
          PROJECT_DIR=/opt/citeaura
          cd "$PROJECT_DIR"

          if [[ ! -f .env.production ]]; then
            printf 'Missing %s/.env.production\n' "$PROJECT_DIR" >&2
            exit 1
          fi

          git checkout main
          if ! git diff --quiet || ! git diff --cached --quiet; then
            printf 'Tracked changes exist in %s; refusing to overwrite them.\n' "$PROJECT_DIR" >&2
            exit 1
          fi
          git fetch origin main
          git pull --ff-only origin main

          if ! git merge-base --is-ancestor "$EXPECTED_SHA" HEAD; then
            printf 'Pushed commit %s is not present in deployed HEAD.\n' "$EXPECTED_SHA" >&2
            exit 1
          fi

          if ((EUID == 0)); then
            "$PROJECT_DIR/scripts/one-click-deploy.sh" \
              --env-file "$PROJECT_DIR/.env.production"
          else
            sudo -n "$PROJECT_DIR/scripts/one-click-deploy.sh" \
              --env-file "$PROJECT_DIR/.env.production"
          fi

          printf 'Deployed CiteAura commit %s\n' "$(git rev-parse HEAD)"
          REMOTE_SCRIPT
